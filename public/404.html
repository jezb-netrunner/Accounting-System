<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PH Books</title>
    <script>
      // GitHub Pages serves this file for any unknown path. Encode the path
      // into a query string and bounce to index.html, which restores it.
      // segmentCount = 1 because the app lives under a repo subpath
      // (/Accounting-System/). See https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
